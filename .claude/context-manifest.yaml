# Context enforcement manifest.
#
# Defines warm-start docs (required for every scoped edit) and path-glob
# entries (additional docs required for specific surfaces). Consumed by
# .claude/hooks/context-gate.sh.
#
# Design rationale: docs/current/agent-context-enforcement-design.md
#
# Adding an entry: name it, list the glob(s), list the docs that an agent
# must Read before editing the glob, and assign an owner. Owners are the
# anti-rot mechanism — entries without an owner are assumed stale.

version: 1

# Warm-start docs are required context for ANY edit to a scoped path.
# They are named in CLAUDE.md's MANDATORY warm-start section.
warm_start:
  - docs/current/codebase/TOPOLOGY.md
  - docs/current/codebase/GLOSSARY.md
  - docs/current/codebase/SYNC_SYSTEM_OVERVIEW.md
  - docs/current/codebase/RESERVED_QUERY_TERMS_GLOSSARY.md
  - docs/current/codebase/DEV_ENVIRONMENT_AND_HMR.md
  - docs/current/codebase/KNOWN_ANTI_PATTERNS.md

# Path-glob entries. An edit to a file matching any glob requires the
# warm_start docs plus that entry's required_reads to appear in the
# briefing receipt.
entries:
  - name: bayes-core
    owner: greg
    paths:
      - "bayes/**"
    required_reads:
      - docs/current/codebase/BAYESIAN_ENGINE_RESEARCH.md
    description: >
      Bayesian compiler and inference. Non-obvious invariants around
      re-parameterisation, priors, topo passes, and synthetic builders.

  - name: statistical-enhancement
    owner: greg
    paths:
      - "graph-editor/src/services/statisticalEnhancementService.ts"
      - "graph-editor/src/services/analysisECharts/**"
    required_reads:
      - docs/current/codebase/CHART_PIPELINE_ARCHITECTURE.md
      - docs/current/codebase/FE_BE_STATS_PARALLELISM.md
    description: >
      Frontend statistical enhancement and chart builders. Mirrors the
      backend stats pipeline; parallelism constraints are load-bearing.

  - name: analysis-subject-resolution
    owner: greg
    paths:
      - "graph-editor/lib/analysis_subject_resolution.py"
    required_reads:
      - docs/current/codebase/DATA_RETRIEVAL_QUERIES.md
    description: >
      Analysis subject resolution. Reserved-term definitions drive the
      whole pipeline; the warm-start glossary is the primary reference.

  - name: sync-and-repo-ops
    owner: greg
    paths:
      - "graph-editor/src/services/repositoryOperationsService.ts"
      - "graph-editor/src/services/dataOperationsService.ts"
      - "graph-editor/src/services/workspaceService.ts"
    required_reads:
      - docs/current/codebase/GRAPH_WRITE_SYNC_ARCHITECTURE.md
    description: >
      Sync and repository operations. Known race conditions; IDB is
      source of truth, FileRegistry is an in-memory cache.

  - name: index-rebuild
    owner: greg
    paths:
      - "graph-editor/src/services/indexRebuildService.ts"
    required_reads: []
    description: >
      Index rebuild. Workspace-prefixed IDs and index invariants —
      warm-start sync overview is sufficient.

  # NOTE: cf-runtime must precede be-runner-cluster — find_matched_entry
  # returns the first matching entry, and cf-runtime's paths are a subset
  # of be-runner-cluster's "graph-editor/lib/runner/**" glob.
  - name: cf-runtime
    owner: greg
    paths:
      - "graph-editor/lib/runner/cohort_forecast_v3.py"
      - "graph-editor/lib/runner/forecast_runtime.py"
      - "graph-editor/lib/runner/forecast_state.py"
      - "graph-editor/lib/runner/forecast_preparation.py"
      - "graph-editor/lib/runner/forecast_application.py"
      - "graph-editor/lib/runner/primitive_*.py"
      - "graph-editor/lib/runner/primitives.py"
      - "graph-editor/lib/runner/prefix_arrival.py"
      - "graph-editor/lib/runner/subject_span_composer.py"
      - "graph-editor/lib/runner/span_kernel.py"
      - "graph-editor/lib/runner/span_evidence.py"
      - "graph-editor/lib/runner/span_upstream.py"
      - "graph-editor/lib/runner/span_adapter.py"
      - "graph-editor/lib/runner/edge_binding_descriptor.py"
    required_reads:
      - docs/current/codebase/COHORT_ANALYSIS_NUMERATOR_DENOMINATOR_SEMANTICS.md
      - docs/current/codebase/FORECAST_RUNTIME_ARCHITECTURE.md
      - docs/current/codebase/FORECAST_STACK_DATA_FLOW.md
      - docs/current/codebase/CF_PRIMITIVE_SUBSTRATE.md
      - docs/current/codebase/CF_ROW_PIPELINE.md
      - docs/current/codebase/CF_DEFENSIVE_FINDINGS.md
      - docs/current/codebase/CF_HOLD_OUT_ENGINES.md
      - docs/current/codebase/CF_RESIDUAL_GUARD.md
      - docs/current/codebase/DRAW_FAMILY_KEYING.md
      - docs/current/codebase/CF_REFACTOR_TRACKERS.md
      - docs/current/codebase/BE_RUNNER_CLUSTER.md
      - docs/current/codebase/STATS_SUBSYSTEMS.md
      - docs/current/codebase/FE_BE_STATS_PARALLELISM.md
    description: >
      The conditioned-forecast machinery: cohort_forecast_v3 runtime,
      primitive substrate, span composition, selected-Cohort reduction,
      and row projection. This subsystem is delicate and complex, with
      subtle semantic invariants documented in the canonical trio plus
      the CF substrate / row pipeline / defensive-findings / hold-out /
      residual-guard / draw-family-keying / refactor-trackers docs.
      Read order: semantics (the rules and the canonical "Implementation
      invariants" section), runtime (what the code does and why),
      data flow (I/O and persistence), then the CF_* substrate detail
      docs that resolve the §A.*-style references peppering the code.
      BE_RUNNER_CLUSTER / STATS_SUBSYSTEMS / FE_BE_STATS_PARALLELISM are
      also required for placement and orchestration context. The full
      set exists precisely because edits here without it tend to violate
      invariants invisibly. INVARIANTS I-45, I-46, I-47, I-48 are
      load-bearing for this scope.

  - name: be-runner-cluster
    owner: greg
    paths:
      - "graph-editor/lib/runner/**"
    required_reads:
      - docs/current/codebase/BE_RUNNER_CLUSTER.md
      - docs/current/codebase/STATS_SUBSYSTEMS.md
      - docs/current/codebase/FE_BE_STATS_PARALLELISM.md
    description: >
      Python backend analysis and forecasting cluster (~18.5kLOC).
      Load-bearing invariants around FE/BE parallelism, regime
      selection, IS conditioning seam, span composition, MECE, and
      runner dispatch via analysis_types.yaml. Edits here without the
      umbrella doc tend to break invisible contracts. Files inside the
      forecast / CF runtime are scoped under cf-runtime above and
      additionally require the semantics / runtime / data-flow trio.
