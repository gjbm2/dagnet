# Synthetic fixture for F-mode regression test (1-May-26 / fix on
# `cohort_forecast_v3.model_rate_draws`).
#
# Purpose: validate the F-mode chart line via a fixture whose
# probability `p` drifts deterministically across the observable
# range. Without drift, F and E+F coincide everywhere and the
# F-mode invariant is vacuous.
#
# Drift design: linear-in-p from base `p = 0.20` to `drift_p_to = 0.80`
# over the 100-day observable window (12-Dec-25 to 21-Mar-26).
# burn-in stays at base_p; observable day d has p = 0.20 + 0.6 × d/(n_days−1).

graph:
  name: synth-fmode-drift
  anchor: fmode-drift-a
  raw_ids: true

nodes:
  fmode-drift-a:
    label: A
    event_id: fmode-drift-a-event
    is_start: true
  fmode-drift-b:
    label: B
    event_id: fmode-drift-b-event
    absorbing: true
    outcome_type: success

edges:
  fmode-drift-a-to-b:
    from: fmode-drift-a
    to: fmode-drift-b
    p: 0.20
    onset: 1.0
    mu: 2.0
    sigma: 0.4
    latency_parameter: true

simulation:
  mean_daily_traffic: 5000
  n_days: 100
  kappa_sim_default: 50.0
  failure_rate: 0.05
  drift_sigma: 0.0
  drift_rate: 0.0
  drift_p_to: 0.80
  growth_rate_mom: 0.0
  seed: 42
  base_date: "2025-12-12"
