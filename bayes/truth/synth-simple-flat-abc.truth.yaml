graph:
  name: synth-simple-flat-abc
  description: Dense flat A->B->C fixture matching synth-simple-abc truth with dispersion, drift, growth, and snapshot sparsity disabled.
  anchor: a

simulation:
  mean_daily_traffic: 20000
  n_days: 120
  kappa_sim_default: 1000000000.0
  kappa_step_default: 0.0
  failure_rate: 0.0
  frame_drop_rate: 0.0
  toggle_rate: 0.0
  initial_absent_pct: 0.0
  drift_sigma: 0.0
  drift_rate: 0.0
  growth_rate_mom: 0.0
  snapshot_start_offset: 0
  traffic_cv: 0.0
  seed: 4242
  expected_sample_seconds: 900

nodes:
  a:
    start: true
    label: A
  b:
    label: B
  c:
    absorbing: true
    outcome_type: success
    label: C

edges:
  a-to-b:
    from: a
    to: b
    p: 0.90
    onset: 1.0
    mu: 2.3
    sigma: 0.5
  b-to-c:
    from: b
    to: c
    p: 0.90
    onset: 2.0
    mu: 2.5
    sigma: 0.6
